services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: open_research
      POSTGRES_USER: open_research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_research -d open_research"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3100
      DATABASE_URL: postgresql://open_research:${POSTGRES_PASSWORD}@db:5432/open_research
      API_KEY: ${API_KEY:?API_KEY is required}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    ports:
      - "127.0.0.1:8050:3100"
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
