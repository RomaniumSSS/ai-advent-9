# Шаблон opt-in drop-in. Не устанавливается автоматически.
[Service]
Environment=DAY12_MASS_LEDGER=/var/lib/ai-advent-day12/mass-ledger.json
ExecStart=
ExecStart=/opt/ai-advent-day12/.venv/bin/python /opt/ai-advent-day12/day12/web.py --mass-policy /etc/ai-advent-day12/mass-live-policy.json --mass-ledger /var/lib/ai-advent-day12/mass-ledger.json --mass-gate /var/lib/ai-advent-day12/mass-gate.json --read-port 8035 --run-port 8036 --db /var/lib/ai-advent-day12/history.db
