name: Open Research Watch

on:
  push:
    paths:
      - "zapier-open-research/**"
      - ".github/workflows/open-research-watch.yml"
  pull_request:
    paths:
      - "zapier-open-research/**"
      - ".github/workflows/open-research-watch.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zapier-open-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: zapier-open-research/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate
