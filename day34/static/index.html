<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Day34 · Файлы проекта</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e7eef9;font:16px/1.6 system-ui}main{max-width:1080px;margin:auto;padding:36px 22px}h1{font-size:32px;margin:10px 0}small{overflow-wrap:anywhere;color:#9fb4ce}section{background:#1b2940;padding:22px;border:1px solid #34465e;border-radius:14px;margin:18px 0}textarea{width:100%;min-height:95px;background:#101827;color:inherit;border:1px solid #637c9b;border-radius:8px;padding:12px;font:inherit}button{padding:11px 16px;margin:8px 8px 0 0;background:#9ee6cb;color:#132838;border:0;border-radius:8px;cursor:pointer;font:inherit}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 monospace;margin:8px 0}details{border-top:1px solid #40536a;padding:10px 0}summary{cursor:pointer}#status{color:#9ee6cb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid section{min-width:0}h2{font-size:21px;margin-top:0}@media(max-width:700px){.grid{display:block}main{padding:18px 14px}h1{font-size:27px}}</style>
<main><small>AI ADVENT · DAY 34</small><h1>Ассистент файлов проекта</h1><p id="mode">Проверка режима…</p><section><label for="goal">Цель</label><textarea id="goal">Найди все использования API send_invite и объясни поток вызовов</textarea><button id="find">Найти API</button><button id="update">Обновить README</button><button id="start">Запустить в чистой копии</button><p id="status" role="status">Каждый запуск создаёт новый sandbox. Исходные fixtures сохраняются.</p></section><section><h2>Действия</h2><div id="events">Здесь появятся фактические операции с файлами.</div></section><div class="grid"><section><h2>Ответ</h2><pre id="answer">—</pre></section><section><h2>Diff</h2><pre id="diff">—</pre></section></div><small id="receipt"></small></main>
<script>
const $=id=>document.getElementById(id);fetch('/api/status').then(r=>r.json()).then(x=>$('mode').textContent=x.mode==='offline mock'?'ОФЛАЙН MOCK · сценарный тест, без AI и API-вызовов':'LIVE · Qwen / OpenRouter');
$('find').onclick=()=>$('goal').value='Найди все использования API send_invite и объясни поток вызовов';$('update').onclick=()=>$('goal').value='Обнови README по текущему поведению кода и покажи изменения';
$('start').onclick=async()=>{let b=$('start');b.disabled=true;$('status').textContent='Выполнение…';$('events').replaceChildren();$('answer').textContent='—';$('diff').textContent='—';try{let r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:$('goal').value})});let x=await r.json();if(!r.ok)throw Error(x.error);for(let e of x.events){let d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=`Шаг ${e.step} · ${e.tool} · ${e.result.ok?'OK':'ОШИБКА'}`;p.textContent=JSON.stringify({arguments:e.arguments,result:e.result},null,2);d.append(s,p);$('events').append(d)}$('answer').textContent=x.answer||'Остановлено без итогового ответа';$('diff').textContent=x.diff||'Изменений нет';$('status').textContent=`${x.status} · ${x.reason} · ${x.elapsed_seconds} с`;$('receipt').textContent=`Run ${x.run_id} · requested ${x.requested_model} · actual ${JSON.stringify(x.actual_responses)} · trace.json рядом с sandbox: ${x.sandbox}`;}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
</script></html>
